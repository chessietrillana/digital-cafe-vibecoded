{% extends "base.html" %}

{% block title %}Sign up — Digital Cafe{% endblock %}

{% block content %}
<div class="card">
    <h2>Sign up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Sign up</button>
    </form>
    <p><a href="{% url 'login' %}?next={{ next|urlencode }}">Already have an account? Log in</a></p>
</div>
{% endblock %}
