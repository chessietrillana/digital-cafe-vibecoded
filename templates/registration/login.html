{% extends "base.html" %}

{% block title %}Log in — Digital Cafe{% endblock %}

{% block content %}
<div class="card">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
    <p><a href="{% url 'signup' %}?next={{ next|urlencode }}">Don't have an account? Sign up</a></p>
</div>
{% endblock %}
